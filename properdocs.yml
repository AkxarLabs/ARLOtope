site_name: ARLOtope
site_description: Visually manage agent teams and iterate across research projects.
site_url: https://akxarlabs.github.io/ARLOtope/
docs_dir: docs
exclude_docs: |
  /plans/
theme:
  name: material
  palette:
    - scheme: arlotope
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - scheme: arlotope-night
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  font: false
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
  logo: assets/brand/arlotope-mark.png
  favicon: assets/brand/arlotope-mark.png

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "§"
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Start here:
      - Install: install.md
      - First study: getting-started.md
      - How it fits together: research-first.md
      - Dashboard tour: dashboard.md
  - Everyday work:
      - Start and follow work: running-work.md
      - Notes, answers & sources: knowledge.md
      - Outputs & visual summaries: artifacts.md
      - Recover work: recovering-work.md
      - Projects & storage: projects.md
  - Build workflows:
      - Tasks, agents & rooms: agent-workflows.md
      - Import and use skills: skills.md
      - Customize a process: customising.md
      - Room previews: room-design.md
      - Tags: tags.md
  - Agents & machines:
      - Use an API provider: api-providers.md
      - Connect an ACP agent: acp.md
      - Connect a remote project: remote-projects.md
      - Machines & compute: compute.md
      - Platform support: platforms-and-agents.md
  - Reference:
      - Terminal & HTTP API: api.md
      - Workflow YAML: workflow.md
      - Configuration: configuration.md
      - Approvals & evidence: monitoring.md
      - Background work: autonomy.md
      - Research methods:
          - Discuss a question: discuss.md
          - Methodology types: project-types.md
          - Target-driven studies: compete.md
          - External research tools: external-frameworks.md
          - Workflow limits: research-limits.md
      - Development:
          - Extensions: extending.md
          - Tools: tools.md
          - Internals: internals.md
          - Interface language: ui-copy.md
          - Design rationale: DESIGN.md
      - License: licensing.md
