[pytest]
# Hermetic hub-tools suite. Temp dirs come from pytest's default base (…/Temp/pytest-of-<user>),
# which numbers each run, so separate runs can go at once and xdist workers get their own folders.
# (A fixed --basetemp is wiped at the start of every run and collides between concurrent ones;
# in a sandbox where the OS temp is unwritable, pass --basetemp=<dir> on the command line.)
addopts = -q
testpaths = .
