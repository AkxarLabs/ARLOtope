# The lab's workflows — the ONE definition of its states, stages, workflows, checkpoints and rooms.
#
# The PI's to shape: add a state, a stage, a room, a workflow or a checkpoint, change what a state offers,
# then run `tools/workflow.py check`. Agents never edit it (the signature guard refuses). HOW a procedure is
# done is the PI's too, in lab/workflow/ and studies/<slug>/workflow/ (the dashboard's Workflow page), layered
# onto each procedure by `tools/workflow.py brief`. Nothing about the checkpoints is fixed by code.
#
# The PROCEDURES are not listed here: each skill defines itself in its own SKILL.md frontmatter (`newts:` —
# kind, level, mode, args, launchable, replaceable, title, does, outputs, …), so adding a procedure is
# adding a skill folder. This file says which stage a procedure serves and what each state offers.
#
# Read through tools/workflow.py by: the guard (legal transitions), the executor (what a click may
# launch), the signature guard, the campaign keeper, the dashboard (labels, board, rooms, next steps),
# check_lab, and the generated docs. `uv run --with pyyaml python tools/workflow.py check` validates it.

version: 1

# ── registry states, in lifecycle order ──────────────────────────────────────────────────────────
# stage: which stage (below) the state belongs to · room/station: where it stands in the dashboard's world
# revivable: a parked/killed study may be revived into it · terminal: nothing more runs · results: the study
# has results (a settled one owes a RECIPE write-back) · tone: its colour on a state pill (ok | muted | bad)
states:
  - {id: seed,            label: Seed,              stage: ideation,     room: incubator, station: seed,        revivable: true}
  - {id: triaged,         label: Triaged,           stage: ideation,     room: incubator, station: triage,      revivable: true}
  - {id: lit-review,      label: Literature review, stage: literature,   room: study,     station: stacks,      revivable: true}
  - {id: scoping,         label: Scoping,           stage: scoping,      room: study,     station: scoping,     revivable: true}
  - {id: proposal,        label: Proposal,          stage: proposal,     room: study,     station: proposal,    revivable: true}
  - {id: active,          label: Experiments,       stage: experiments,  room: lab,       station: experiments, revivable: true}
  - {id: analysis,        label: Analysis,          stage: analysis,     room: bench,     station: bench,       results: true}
  - {id: writing,         label: Writing,           stage: writing,      room: writing,   station: drafting,    results: true}
  - {id: internal-review, label: Internal review,   stage: review,       room: writing,   station: review,      results: true}
  - {id: final,           label: Final,             stage: finalization, room: archive,   station: rest,        terminal: true, results: true, tone: ok}

# reachable from ANY state (whichever procedure finds the evidence records it); terminal
side_states:
  - {id: parked, label: Parked, room: margins, station: parked, terminal: true, tone: muted}
  - {id: killed, label: Killed, room: margins, station: killed, terminal: true, tone: bad}

# where a revived study goes unless the PI picks another revivable state
revive_to: triaged

# documented back-edges (the paper-phase round trip); every other move is one step forward
back_edges:
  - [analysis, active]
  - [writing, active]
  - [internal-review, active]
  - [writing, analysis]
  - [internal-review, writing]
  - [analysis, writing]

# ── workflows: the paths a study can follow, and the PI's checkpoints on each ─────────────────────
# A study follows one workflow (its IDEA.md `workflow:` line; the first one here is the default). `steps` are
# states in order. A checkpoint is an approval the PI (or a delegate) gives:
#   before: <step>              the study can't enter that step until it is approved
#   during: <step> + at: "…"    the agent stops at that point inside the step and asks
#   approver: me | me-or-campaign | auto (auto = approved when its checks pass, else it waits for the PI)
#   then: <procedure>           what approving it starts ("Approve and create the project")
#   checks: [...]               scripts it shows (and `auto` needs passing) · detect: a check for work done past it
#   evidence: [...]             what the PI looks at ({study} = the study's slug, {project} = its project repo)
#   tell: what agents are told about it (it goes into every brief)
# Any checkpoint can be changed, moved or removed — a workflow with none is valid. Approvals are records
# (lab/approvals.jsonl), written only by the PI's dashboard, the PI's `newts approve` and a campaign keeper.
workflows:
  - id: research
    title: Research paper
    blurb: From an idea to a reviewed paper, with three checkpoints.
    steps: [seed, triaged, lit-review, scoping, proposal, active, analysis, writing, internal-review, final]
    checkpoints:
      - id: approve-proposal
        title: Approve the proposal
        before: active
        approver: me-or-campaign
        then: spawn-project
        evidence: ["studies/{study}/proposal.md", "studies/{study}/lit-review.md", "studies/{study}/decisions.md"]
        means: the hypothesis, the frozen evaluation and analysis plan, the budget and the kill criteria
        tell: Stop when the proposal is written and present it; the project is created only after approval.
      - id: approve-full-runs
        title: Approve full runs
        during: active
        at: full-scale runs
        approver: me-or-campaign
        detect: full-runs-without-approval
        evidence: ["{project}/PLAN.md", "{project}/EXPERIMENT_LOG.md", "{project}/control.yaml"]
        means: the trial runs met their written promotion criteria, and the planned full runs fit the budget
        tell: Run smoke tests and trial runs freely. Before the first full-scale run, stop and ask for this approval.
      - id: finalize-paper
        title: Finalize the paper
        before: final
        approver: me-or-campaign
        then: finalize
        checks: [claims, multiseed, ablations, eval, prereg]
        evidence: ["studies/{study}/paper/main.pdf", "studies/{study}/paper/reviews", "studies/{study}/paper/claims.yaml"]
        means: the reviewed paper is final; reproducibility pass, artifacts locked, knowledge written back
        tell: Stop when internal review accepts; finalization starts only after approval.
  - id: target
    title: Target-driven
    blurb: Beat a target score; no paper.
    steps: [active, final]
    checkpoints:
      - id: approve-external-scoring
        title: Approve external scoring
        during: active
        at: sending an output to an external scorer
        approver: me
        evidence: ["{project}/TARGET.md", "{project}/runs/scores.jsonl"]
        means: outputs may be sent to the external scorer; say in your note how many reads you allow
        tell: Score locally as much as you like. Sending an output outside the lab waits for this approval; follow the PI's note on how many reads.
      - id: approve-final-output
        title: Choose the final output
        before: final
        approver: me
        then: finalize
        evidence: ["{project}/TARGET.md", "{project}/EXPERIMENT_LOG.md", "{project}/runs/registry.jsonl"]
        means: the run whose output is submitted as the final result
        tell: Stop when the target is met or the budget is spent, and present the best runs.
  - id: quick
    title: Quick study
    blurb: From an idea straight to experiments and an analysis, with no checkpoints at all.
    steps: [seed, proposal, active, analysis, final]
    checkpoints: []

# ── stages: what the PI sees as the steps of the workflow ────────────────────────────────────────
# procedures: the procedures that do this stage's work (first = primary) · substages: inside the stage
stages:
  - {id: ideation,     title: Ideas,             states: [seed, triaged],   procedures: [ideate]}
  - {id: literature,   title: Literature review, states: [lit-review],      procedures: [lit-review, critique-paper]}
  - {id: scoping,      title: Scoping,           states: [scoping],         procedures: [scope]}
  - {id: proposal,     title: Proposal,          states: [proposal],        procedures: [propose, spawn-project]}
  - {id: experiments,  title: Experiments,       states: [active],          procedures: [experiment, improve, research-loop],
     substages: [SMOKE, PILOT, FULL]}
  - {id: analysis,     title: Analysis,          states: [analysis],        procedures: [analyze]}
  - {id: writing,      title: Writing,           states: [writing],         procedures: [write-paper, make-figures]}
  - {id: review,       title: Internal review,   states: [internal-review], procedures: [review-paper, critique-paper]}
  - {id: finalization, title: Finalization,      states: [final],           procedures: [finalize]}

# the rooms on the dashboard's table = the Studies board's columns. Data generation (the Lab) and its
# interpretation (the Bench) are separate rooms on purpose: analysis reads run artifacts and writes none. A room stands on a plot round the PI's desk:
# `place: [column, row]` and `facing: n|e|s|w` put it there (Workflow → Rooms: drag it); without them it takes
# the next free plot. `per_project: true` makes it one room PER LIVE PROJECT (each project its own lab). How a
# room looks is dashboard/static/world3d/rooms/<id>.js, or the lab's own lab/rooms3d/<id>.json (Compose → a
# room → Look: describe it and an agent designs it); a room with neither is drawn plain — adding a room is
# adding a line here.
rooms:
  - {id: incubator, label: Ideas,   title: The Incubator,    states: [seed, triaged]}
  - {id: study,     label: Study,   title: The Study,        states: [lit-review, scoping, proposal]}
  - {id: lab,       label: Lab,     title: The Lab,          states: [active], per_project: true}
  - {id: bench,     label: Analysis, title: The Bench,      states: [analysis]}
  - {id: writing,   label: Writing, title: The Writing Room, states: [writing, internal-review]}
  - {id: archive,   label: Done,    title: The Archive,      states: [final]}
  - {id: margins,   label: Margins, title: The Margins,      states: [parked, killed]}

# the one next step for a study in a state, when no run is live and no checkpoint waits.
next_for_state:
  seed: advance                  # /advance on a seed = the /ideate reflect + triage phases for it
  triaged: lit-review
  lit-review: scope
  scoping: propose
  proposal: propose               # once the proposal's checkpoint is approved, its `then` runs
  active: experiment
  analysis: analyze
  writing: write-paper
  internal-review: review-paper

# what the study page's "Work on it…" offers per state (first = default)
offer_for_state:
  seed: [advance, lit-review, discuss]
  triaged: [lit-review, advance, discuss]
  lit-review: [lit-review, scope, advance]
  scoping: [scope, propose, advance]
  proposal: [propose, spawn-project, advance]
  active: [experiment, improve, research-loop, analyze]
  analysis: [analyze, experiment, make-figures, write-paper]
  writing: [write-paper, make-figures, critique-paper]
  internal-review: [review-paper, critique-paper, write-paper]
