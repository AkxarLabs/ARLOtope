name: ci
on:
  workflow_dispatch:
jobs:
  macos-probe:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Full suite with a diagnostic per-test deadline
        env:
          NEWTS_HOME: ${{ runner.temp }}/newts-probe-home
        run: uv run --with pyyaml --with pytest --with pytest-timeout python -m pytest tests/ -vv -s --timeout=180 --timeout-method=thread
